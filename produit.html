<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Produit</title><meta name="description" content="" id="md"><meta property="og:type" content="product"><meta property="og:title" content="" id="ogt"><meta property="og:image" content="" id="ogi">
<link rel="stylesheet" href="style.css"></head><body>
<nav class="nav"><div class="wrap"><a class="logo" href="index.html" id="shop">Ma Boutique</a><a href="index.html" style="font-size:.9rem">Tous les produits</a></div></nav>
<main id="app"><div class="wrap"><p style="padding:40px 0">Chargement…</p></div></main>
<footer><div class="wrap">© <span id="y"></span> <span class="n"></span> · <a href="#">Mentions légales</a></div></footer>
<script src="app.js"></script>
<script>
$("#shop").textContent=SHOP;$(".n").textContent=SHOP;$("#y").textContent=new Date().getFullYear();
const slug=new URLSearchParams(location.search).get("slug");
(async()=>{
  try{
    const [p]=await sbGet("products?slug=eq."+encodeURIComponent(slug)+"&published=eq.true&limit=1");
    if(!p)throw 0; render(p); related(p);
  }catch(e){$("#app").innerHTML='<div class="wrap"><p style="padding:40px 0">Produit introuvable. <a href="index.html">Retour à la boutique</a></p></div>'}
})();
function render(p){
  const disc=p.old_price?Math.round((1-p.price/p.old_price)*100):0, g=p.guarantee_days;
  document.title=p.title+" | "+SHOP; $("#md").content=p.subtitle||""; $("#ogt").content=p.title; $("#ogi").content=p.cover_url||"";
  const ld={"@context":"https://schema.org","@type":"Product",name:p.title,description:p.subtitle,image:p.cover_url,offers:{"@type":"Offer",price:p.price,priceCurrency:"XOF",availability:"https://schema.org/InStock"}};
  if(p.reviews_count>0)ld.aggregateRating={"@type":"AggregateRating",ratingValue:p.rating,reviewCount:p.reviews_count};
  const s=document.createElement("script");s.type="application/ld+json";s.textContent=JSON.stringify(ld);document.head.append(s);
  const cover=p.cover_url?`<img src="${esc(p.cover_url)}" alt="${esc(p.title)}">`:`<div class="ph">${esc(p.title)}</div>`;
  const wa=p.whatsapp?`<p class="secure"><a href="https://wa.me/${esc(p.whatsapp)}" rel="noopener">💬 Une question ? Écris‑moi sur WhatsApp</a></p>`:"";
  const buyBox=`<div class="price"><strong>${money(p.price)}</strong>${p.old_price?`<s>${money(p.old_price)}</s><span class="off">-${disc} %</span>`:""}</div>
    <button class="btn js-buy">Acheter maintenant</button><p class="secure">🔒 Paiement sécurisé · Accès immédiat</p>
    <ul class="incl"><li>Accès immédiat après paiement</li>${p.pages_count?`<li>${p.pages_count} pages, PDF lisible sur téléphone</li>`:""}<li>Accès à vie, sans abonnement</li><li>Garantie ${g} jours</li></ul>${wa}`;
  const cur=(p.curriculum||[]).map(m=>`<details><summary>${esc(m.title)}</summary><ul>${(m.items||[]).map(i=>`<li>${esc(i)}</li>`).join("")}</ul></details>`).join("");
  const tes=(p.testimonials||[]).map(t=>`<div class="tcard">${t.result?`<span class="res">${esc(t.result)}</span>`:""}<p>« ${esc(t.text)} »</p><strong>${esc(t.name)}</strong>${t.city?`, <span style="color:var(--muted)">${esc(t.city)}</span>`:""}</div>`).join("");
  const faq=(p.faq||[]).map(f=>`<details><summary>${esc(f.q)}</summary><p>${esc(f.a)}</p></details>`).join("");
  $("#app").innerHTML=`<div class="wrap">
  <div class="crumb"><a href="index.html">Boutique</a> › ${esc(p.category)}</div>
  <div class="layout"><div>
    <section style="padding-top:18px"><h1>${esc(p.title)}</h1><p style="font-size:1.1rem;color:var(--muted)">${esc(p.subtitle)}</p>
      <div class="meta"><span><span class="st">${stars(p.rating)}</span> <b>${Number(p.rating).toFixed(1)}</b> (${p.reviews_count} avis)</span>${p.buyers_count?`<span><b>${p.buyers_count}+</b> lecteurs</span>`:""}<span>Par <b>${esc(p.author_name)}</b></span></div>
      <div class="cover">${cover}</div></section>
    <div class="trust"><div><i>🔒</i>Paiement sécurisé</div><div><i>⚡</i>Accès immédiat</div><div><i>🛡️</i>Garantie ${g} jours</div><div><i>♾️</i>Accès à vie</div></div>
    ${(p.benefits||[]).length?`<div class="box"><h2>Ce que tu vas obtenir</h2><ul class="checks">${p.benefits.map(b=>`<li>${esc(b)}</li>`).join("")}</ul></div>`:""}
    ${p.description?`<section style="padding:10px 0"><h2>Description</h2><p>${esc(p.description)}</p></section>`:""}
    ${cur?`<section style="padding:10px 0"><h2>Contenu</h2>${cur}</section>`:""}
    <section style="padding:10px 0"><h2>Pourquoi acheter ici</h2><div class="why">
      <div><b>Paiement local</b><br><span style="color:var(--muted)">Mobile Money et carte, selon la boutique.</span></div>
      <div><b>Un auteur joignable</b><br><span style="color:var(--muted)">Tu poses tes questions directement.</span></div>
      <div><b>Pas d’abonnement</b><br><span style="color:var(--muted)">Tu paies une fois, tu gardes l’accès.</span></div>
      <div><b>Du concret</b><br><span style="color:var(--muted)">Des étapes à appliquer, pas du remplissage.</span></div></div></section>
    ${tes?`<section style="padding:10px 0"><h2>Ils l’ont appliqué</h2><div class="tgrid">${tes}</div></section>`:""}
    <section style="padding:10px 0"><div class="box author"><div class="avatar">${p.author_photo?`<img src="${esc(p.author_photo)}" alt="">`:esc((p.author_name||"?")[0])}</div><div><h3>${esc(p.author_name)}</h3><p style="margin:0;color:var(--muted)">${esc(p.author_bio)}</p></div></div></section>
    <section style="padding:10px 0"><div class="guar"><b>${g}j</b><div><h3 style="margin:0">Satisfait ou remboursé</h3><p style="margin:0;color:var(--muted)">Si le produit ne te convient pas dans les ${g} jours, écris‑nous et on te rembourse.</p></div></div></section>
    ${faq?`<section style="padding:10px 0"><h2>Questions fréquentes</h2>${faq}</section>`:""}
  </div>
  <aside><div class="buy" id="buy">${buyBox}</div></aside></div>
  <section><h2>Dans la même catégorie</h2><div class="grid" id="rel"></div></section></div>
  <div class="mbar" id="mbar"><strong>${money(p.price)}</strong><button class="btn js-buy">Acheter</button></div>`;
  document.querySelectorAll(".js-buy").forEach(b=>b.onclick=()=>{
    if(window.fbq)fbq("track","InitiateCheckout",{value:p.price,currency:"XOF"});
    sbPost("clicks",{product_id:p.id,utm:location.search.slice(0,300)});
    location.href=buyUrl(p.chariow_url);
  });
  if(window.fbq)fbq("track","ViewContent",{content_name:p.title,value:p.price,currency:"XOF"});
  const bar=$("#mbar"),buy=$("#buy");
  const io=new IntersectionObserver(([e])=>bar.classList.toggle("on",!e.isIntersecting&&e.boundingClientRect.top<0));io.observe(buy);
}
async function related(p){
  try{
    const r=await sbGet("products?published=eq.true&category=eq."+encodeURIComponent(p.category)+"&slug=neq."+encodeURIComponent(p.slug)+"&limit=3&select=slug,title,category,price,old_price,cover_url,rating,reviews_count");
    $("#rel").innerHTML=r.map(card).join("")||"<p>Bientôt d’autres produits.</p>";
  }catch(e){}
}
</script></body></html>
